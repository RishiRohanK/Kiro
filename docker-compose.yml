version: '3.8'

services:
  # Load Balancer Node
  load-balancer:
    image: nginx:alpine
    container_name: studyforge_lb
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app_1
      - app_2
    restart: always
    networks:
      - studyforge-net

  # App node 1
  app_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyforge_app_1
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: always
    networks:
      - studyforge-net

  # App node 2
  app_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyforge_app_2
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: always
    networks:
      - studyforge-net

  # Dev node (Single instance, no LB for dev)
  dev:
    image: node:20-alpine
    container_name: studyforge_dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npx prisma generate && npm run dev"
    env_file:
      - .env
    networks:
      - studyforge-net

networks:
  studyforge-net:
    driver: bridge
