events {
    worker_connections 1024;
}

http {
    upstream nextjs_cluster {
        # Use ip_hash to ensure sticky sessions for Socket.io
        ip_hash;
        
        server app_1:3000;
        server app_2:3000;
        # You can add more nodes here
    }

    # Global settings for larger uploads
    client_max_body_size 10M;

    server {
        listen 80;

        location / {
            proxy_pass http://nextjs_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Specific handling for Socket.io if needed (should be covered by /, but for clarity)
        location /socket.io/ {
            proxy_pass http://nextjs_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
